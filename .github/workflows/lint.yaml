name: MARCH source checks

on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.15.12
      - run: >-
          python -m ruff check --select E9,F821
          --extend-per-file-ignores 'swift/*:F821'
          --exclude third_party,march/kernels/_flashqla .
      - run: bash -n scripts/march/*.sh
      - run: python scripts/march/check_public_release.py .
