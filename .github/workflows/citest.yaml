name: MARCH CPU regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Configure writable caches
        shell: bash
        run: |
          printf '%s\n' \
            "HF_HOME=$RUNNER_TEMP/huggingface" \
            "XDG_CACHE_HOME=$RUNNER_TEMP/cache" \
            "TORCH_EXTENSIONS_DIR=$RUNNER_TEMP/torch-extensions" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/march-cpu.txt
      - run: python -m pip install 'setuptools>=77,<81' wheel build
      - run: python -m pip install --no-build-isolation -c requirements/march-constraints.txt -e .
      - run: bash -n scripts/march/*.sh
      - run: python -m pytest tests/march -q
      - run: python scripts/march/check_public_release.py .
      - run: python scripts/march/check_vendor_manifest.py
      - run: python scripts/march/check_operator_correctness.py
      - run: python scripts/march/check_publication.py --allow-draft
      - run: python -m build --wheel
      - run: python -m pip install --no-deps --force-reinstall dist/*.whl
      - run: cd /tmp && python "$GITHUB_WORKSPACE/scripts/march/verify_package.py" --source-root "$GITHUB_WORKSPACE"
